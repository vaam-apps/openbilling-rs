name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI builds with. The MSRV job uses `rust-version` of Cargo.toml instead.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 19 is the minimum (ADR 0001, amended 2026-11-27). Tag and digest: the digest is the multi-arch
        # index of `19.0`, read from Docker Hub on 2026-11-27. Move both together; dependabot does not see this line.
        image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        env:
          # A throwaway database for this job only, reachable from the runner alone: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OPENBILLING_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      # The database tests fail instead of skipping, so a missing database cannot pass CI.
      OPENBILLING_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked --exclude openbilling
      # The service binary's tests apart, so the end-to-end suite (`e2e/`, the `openbilling` package's `e2e`
      # target) is a step of its own in the log: the real `openbilling serve` as a process against this job's
      # PostgreSQL 19, driven only through its HTTP API and webhook. Like every step, it gates the merge.
      - name: The service binary's tests and the end-to-end suite
        run: cargo test -p openbilling --locked

  api-contract:
    name: API contract (CrateStack)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The CLI must be the release the crates are pinned to (Cargo.toml, `cratestack`).
      CRATESTACK_REQUIRE_VERSION: "0.20.6"
      SCHEMA: crates/openbilling-http/schema/openbilling.cstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the CrateStack CLI
        run: npm install --global @cratestack/cli@0.20.6
      - name: The schema checks
        run: cratestack check --schema "$SCHEMA"
      - name: The contract is a locked generation
        run: cratestack contract check --schema "$SCHEMA" --lock crates/openbilling-http/schema/openbilling.contracts.lock
      - name: docs/api/ops.json is what the schema says
        run: |
          cratestack contract ops --schema "$SCHEMA" --json > /tmp/ops.json
          diff -u docs/api/ops.json /tmp/ops.json
          # Every operation needs a caller, and the analysis understood every rule.
          jq -e '[.ops[] | select((.unanalysed | length > 0) or (.requires_principal | not))] | length == 0' /tmp/ops.json

  dashboards:
    name: Dashboards and alerts are generated (no drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The JSON in deploy/dashboards/ and deploy/openbilling/dashboards/, the rules in deploy/alerts/ and
      # deploy/openbilling/alerts/ and their unit tests in tools/dashboards/tests/ are written by tools/dashboards/
      # (Python, standard library only). Regenerate, then fail on any change or any file the scripts made that is not
      # committed.
      - name: Regenerate
        run: sh tools/dashboards/generate.sh
      - name: No difference
        run: |
          git diff --exit-code -- deploy tools/dashboards/tests
          test -z "$(git status --porcelain -- deploy tools/dashboards/tests)" || { git status --porcelain -- deploy tools/dashboards/tests; echo "::error::deploy/ or tools/dashboards/tests/ differs from what tools/dashboards/ generates: run sh tools/dashboards/generate.sh and commit"; exit 1; }
      # promtool is taken from the pinned Prometheus image (tools/observability/versions.env), by digest, with no
      # container runtime: fetch.py reads the registry and checks every layer's sha256 (on a cache miss).
      # Cached by the pins, as observability.yml does: on a hit fetch.py reads no registry (it re-hashes the file against
      # the digest recorded beside it), so a Docker Hub outage does not fail this job.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/prometheus
          key: promtool-${{ hashFiles('tools/observability/versions.env') }}
      - name: Fetch promtool
        run: |
          . tools/observability/versions.env
          python3 -I tools/observability/fetch.py image "$PROMETHEUS_REPO" "$PROMETHEUS_DIGEST" "${RUNNER_TEMP}/prometheus" bin/promtool
          echo "${RUNNER_TEMP}/prometheus" >> "$GITHUB_PATH"
      - name: The rules are valid
        run: promtool check rules deploy/alerts/openbilling.rules.yaml
      - name: The rules fire at their thresholds
        run: promtool test rules tools/dashboards/tests/alerts.test.yaml

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4 (cargo-deny 0.22.1)
        with:
          command: check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  image:
    name: Image (${{ matrix.arch }}, static musl build and smoke test)
    # On pull requests; on main, release.yml builds the same stages and pushes. Nothing is pushed here. One job per
    # architecture on a runner of that architecture, as release.yml does: `x86_64-unknown-linux-musl` and
    # `aarch64-unknown-linux-musl` (ADR 0006).
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            docker: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            docker: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The `smoke` stage builds the static binary `--locked` (and fails if it is not static) and runs `--version` and
      # `--help` on the runtime base, distroless/static, as the runtime user. Read-only cache: main's builds (release.yml) write it.
      - name: Smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/openbilling/Dockerfile
          target: smoke
          platforms: ${{ matrix.docker }}
          push: false
          cache-from: type=gha,scope=openbilling-${{ matrix.arch }}
      # The runtime stage, loaded into the runner's Docker so the next step can run it.
      - name: The runtime stage builds
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/openbilling/Dockerfile
          target: runtime
          platforms: ${{ matrix.docker }}
          load: true
          tags: openbilling:ci
          push: false
          cache-from: type=gha,scope=openbilling-${{ matrix.arch }}
      # `--version` and `--help` never touch the network or a database. This runs `serve` itself from the static image:
      # it connects, applies the migrations, listens, and answers its health routes, on this runner's architecture
      # (the musl binary is otherwise never run against a database: the end-to-end suite runs the glibc host build).
      - name: Serve from the image against PostgreSQL 19
        env:
          # The same pin as the `test` job's service: tag and digest, the multi-arch index of `19.0`.
          POSTGRES_IMAGE: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        run: |
          set -euo pipefail
          # A throwaway database for this job only, on the loopback; the service shares the host's network to reach it.
          docker run -d --name pg --network host -e POSTGRES_HOST_AUTH_METHOD=trust "$POSTGRES_IMAGE"
          for _ in $(seq 1 60); do docker exec pg pg_isready -U postgres -h 127.0.0.1 && break; sleep 1; done
          docker run -d --name ob --network host \
            -e OPENBILLING_DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres \
            -e OPENBILLING_LISTEN=127.0.0.1:8080 \
            openbilling:ci serve
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz > /dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs ob
          [ "$ok" = 1 ] || { echo "::error::the static image's serve never answered /readyz"; exit 1; }
          curl -fsS http://127.0.0.1:8080/healthz
          # SIGTERM is how Kubernetes stops a pod: the service must exit 0.
          docker stop -t 20 ob > /dev/null
          [ "$(docker inspect -f '{{.State.ExitCode}}' ob)" = 0 ] || { echo "::error::serve did not exit 0 on SIGTERM"; exit 1; }

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # kubeconform v0.8.0, linux-amd64: the sha256 its release's CHECKSUMS file lists (verified 2026-11-27).
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -fsSLo "${RUNNER_TEMP}/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  ${RUNNER_TEMP}/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${RUNNER_TEMP}/kubeconform.tar.gz" -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
      # Lint, the values matrix, render-check.sh and kubeconform on each render, the refused values, and the
      # versions of Cargo.toml and Chart.yaml in agreement.
      - run: sh deploy/openbilling/tests/check.sh
