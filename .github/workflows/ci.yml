name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The toolchain CI builds with. The MSRV job uses `rust-version` of Cargo.toml instead.
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # PostgreSQL 19 is the minimum (ADR 0001, amended 2026-11-27). Tag and digest: the digest is the multi-arch
        # index of `19.0`, read from Docker Hub on 2026-11-27. Move both together; dependabot does not see this line.
        image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
        env:
          # A throwaway database for this job only, reachable from the runner alone: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      OPENBILLING_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
      # The database tests fail instead of skipping, so a missing database cannot pass CI.
      OPENBILLING_TEST_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  api-contract:
    name: API contract (CrateStack)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The CLI must be the release the crates are pinned to (Cargo.toml, `cratestack`).
      CRATESTACK_REQUIRE_VERSION: "0.20.6"
      SCHEMA: crates/openbilling-http/schema/openbilling.cstack
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the CrateStack CLI
        run: npm install --global @cratestack/cli@0.20.6
      - name: The schema checks
        run: cratestack check --schema "$SCHEMA"
      - name: The contract is a locked generation
        run: cratestack contract check --schema "$SCHEMA" --lock crates/openbilling-http/schema/openbilling.contracts.lock
      - name: docs/api/ops.json is what the schema says
        run: |
          cratestack contract ops --schema "$SCHEMA" --json > /tmp/ops.json
          diff -u docs/api/ops.json /tmp/ops.json
          # Every operation needs a caller, and the analysis understood every rule.
          jq -e '[.ops[] | select((.unanalysed | length > 0) or (.requires_principal | not))] | length == 0' /tmp/ops.json

  deny:
    name: Dependencies (cargo deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4 (cargo-deny 0.22.1)
        with:
          command: check

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-14
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked
