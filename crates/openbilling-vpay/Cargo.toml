[package]
name = "openbilling-vpay"
description = "The vpay adapter of openbilling-rs's payment provider port."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
hex.workspace = true
hmac.workspace = true
openbilling-core.workspace = true
reqwest.workspace = true
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
url.workspace = true
# The stand-in for tests only (`stand-in`).
axum = { workspace = true, optional = true }
openbilling-testkit = { workspace = true, optional = true }

[features]
# A stand-in for vpay's API, for tests: `openbilling_vpay::stand_in`. No shipping binary enables it.
stand-in = ["dep:axum", "dep:openbilling-testkit", "tokio/net", "tokio/rt", "tokio/sync"]

[dev-dependencies]
openbilling-vpay = { path = ".", features = ["stand-in"] }
openbilling-pg.workspace = true
openbilling-metrics.workspace = true
openbilling-testkit.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
