[package]
name = "openbilling-telemetry"
description = "OpenTelemetry for openbilling-rs: traces, metrics and logs over OTLP/HTTP JSON, off unless an endpoint is set."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A collector in the process, for tests: it receives what the exporter sends and keeps it.
testkit = ["dep:axum"]

[dependencies]
openbilling-core.workspace = true
openbilling-metrics.workspace = true
axum = { workspace = true, optional = true }
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
openbilling-telemetry = { path = ".", features = ["testkit"] }
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
