[package]
name = "openbilling-sdk"
description = "A Rust client for the openbilling-rs usage billing API: typed calls over a client CrateStack generates from the API's schema."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["billing", "usage", "metering", "ledger", "client"]
categories = ["api-bindings", "web-programming::http-client"]
# What `cargo publish` packages: the code, the schema it is generated from, the README and the licence (copies of the root's, held equal in CI). Nothing from the rest of
# the repository is needed to build it (ADR 0008).
include = ["src/**", "tests/**", "schema/openbilling.cstack", "README.md", "LICENSE", "NOTICE", "Cargo.toml"]

[dependencies]
# CrateStack's client-only facade: `include_client_schema!` and the HTTP runtime, no server crates (no axum, no sqlx).
# The library is named `cratestack`.
cratestack-client.workspace = true
# The generated structs derive through bare `serde::` paths.
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
url.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
