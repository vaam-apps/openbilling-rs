# Generated by tools/dashboards/alerts.py: edit that, never this file. `promtool test rules` runs it.
# Per signal, three jobs: under the warning (nothing fires), in the warning band, and above critical.
rule_files:
  - ../../../deploy/alerts/openbilling.rules.yaml
evaluation_interval: 1m
tests:
  - name: http_5xx_ratio
    interval: 1m
    input_series:
      - series: "http_server_request_duration_seconds_count{job=\"low\",status=\"5xx\"}"
        values: "0+0.05x40"
      - series: "http_server_request_duration_seconds_count{job=\"low\",status=\"2xx\"}"
        values: "0+99.95x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"5xx\"}"
        values: "0+0.55x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"2xx\"}"
        values: "0+99.45x40"
      - series: "http_server_request_duration_seconds_count{job=\"high\",status=\"5xx\"}"
        values: "0+1.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"high\",status=\"2xx\"}"
        values: "0+98.5x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingHttp5xxWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 0.1% of requests answer 5xx"
              description: "The service answers 5xx to more than 0.1% of its requests over the window: a bug, PostgreSQL unavailable, or a deploy gone wrong. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingHttp5xxCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 1% of requests answer 5xx"
              description: "The service answers 5xx to more than 1% of its requests over the window: a bug, PostgreSQL unavailable, or a deploy gone wrong. See deploy/alerts/README.md."
  - name: http_4xx_ratio
    interval: 1m
    input_series:
      - series: "http_server_request_duration_seconds_count{job=\"low\",status=\"4xx\"}"
        values: "0+2.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"low\",status=\"2xx\"}"
        values: "0+97.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"4xx\"}"
        values: "0+12.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"2xx\"}"
        values: "0+87.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"high\",status=\"4xx\"}"
        values: "0+30x40"
      - series: "http_server_request_duration_seconds_count{job=\"high\",status=\"2xx\"}"
        values: "0+70x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingHttp4xxWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 5% of requests are refused with 4xx"
              description: "More than 5% of requests are refused with 4xx over the window: a producer sending bad requests, or a credential or issuer problem. See deploy/alerts/README.md."
      - eval_time: 19m
        alertname: OpenbillingHttp4xxCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 20% of requests are refused with 4xx"
              description: "More than 20% of requests are refused with 4xx over the window: a producer sending bad requests, or a credential or issuer problem. See deploy/alerts/README.md."
  - name: allowed_refused_ratio
    interval: 1m
    input_series:
      - series: "openbilling_allowed_checks_total{job=\"low\",verdict=\"refused\"}"
        values: "0+10x40"
      - series: "openbilling_allowed_checks_total{job=\"low\",verdict=\"allowed\"}"
        values: "0+90x40"
      - series: "openbilling_allowed_checks_total{job=\"band\",verdict=\"refused\"}"
        values: "0+35x40"
      - series: "openbilling_allowed_checks_total{job=\"band\",verdict=\"allowed\"}"
        values: "0+65x40"
      - series: "openbilling_allowed_checks_total{job=\"high\",verdict=\"refused\"}"
        values: "0+75x40"
      - series: "openbilling_allowed_checks_total{job=\"high\",verdict=\"allowed\"}"
        values: "0+25x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingAllowedRefusedWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 20% of getAllowed answers refuse"
              description: "More than 20% of getAllowed answers refuse over the window: usage is being stopped (debt limit, balance or member cap). See deploy/alerts/README.md."
      - eval_time: 19m
        alertname: OpenbillingAllowedRefusedCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 50% of getAllowed answers refuse"
              description: "More than 50% of getAllowed answers refuse over the window: usage is being stopped (debt limit, balance or member cap). See deploy/alerts/README.md."
  - name: queue_backlog
    interval: 1m
    input_series:
      - series: "openbilling_queue_backlog{job=\"low\"}"
        values: "5000x40"
      - series: "openbilling_queue_backlog{job=\"band\"}"
        values: "55000x40"
      - series: "openbilling_queue_backlog{job=\"high\"}"
        values: "150000x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingQueueBacklogWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: the usage queue holds 10000 undecided events"
              description: "More than 10000 usage events are received and not decided: the drain is behind or stopped. See deploy/alerts/README.md."
      - eval_time: 19m
        alertname: OpenbillingQueueBacklogCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: the usage queue holds 100000 undecided events"
              description: "More than 100000 usage events are received and not decided: the drain is behind or stopped. See deploy/alerts/README.md."
  - name: queue_oldest_age_seconds
    interval: 1m
    input_series:
      - series: "openbilling_queue_oldest_age_seconds{job=\"low\"}"
        values: "15x40"
      - series: "openbilling_queue_oldest_age_seconds{job=\"band\"}"
        values: "165x40"
      - series: "openbilling_queue_oldest_age_seconds{job=\"high\"}"
        values: "450x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingQueueOldestAgeWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: the oldest undecided event has waited 30"
              description: "The oldest undecided usage event has waited more than 30 seconds: what a producer feels as lag. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingQueueOldestAgeCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: the oldest undecided event has waited 300"
              description: "The oldest undecided usage event has waited more than 300 seconds: what a producer feels as lag. See deploy/alerts/README.md."
  - name: drain_lag_seconds
    interval: 1m
    input_series:
      - series: "openbilling_drain_lag_seconds{job=\"low\"}"
        values: "15x40"
      - series: "openbilling_drain_lag_seconds{job=\"band\"}"
        values: "75x40"
      - series: "openbilling_drain_lag_seconds{job=\"high\"}"
        values: "180x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingDrainLagWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: no drain pass has succeeded for 30"
              description: "No drain pass has succeeded for more than 30 seconds, even with an empty queue: the drain fails or has stopped while the service still reports. A service that reports nothing is OpenbillingNotReportingCritical. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingDrainLagCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: no drain pass has succeeded for 120"
              description: "No drain pass has succeeded for more than 120 seconds, even with an empty queue: the drain fails or has stopped while the service still reports. A service that reports nothing is OpenbillingNotReportingCritical. See deploy/alerts/README.md."
  - name: drain_error_ratio
    interval: 1m
    input_series:
      - series: "openbilling_drain_runs_total{job=\"low\",result=\"error\"}"
        values: "0+0.5x40"
      - series: "openbilling_drain_runs_total{job=\"low\",result=\"ok\"}"
        values: "0+99.5x40"
      - series: "openbilling_drain_runs_total{job=\"band\",result=\"error\"}"
        values: "0+5.5x40"
      - series: "openbilling_drain_runs_total{job=\"band\",result=\"ok\"}"
        values: "0+94.5x40"
      - series: "openbilling_drain_runs_total{job=\"high\",result=\"error\"}"
        values: "0+15x40"
      - series: "openbilling_drain_runs_total{job=\"high\",result=\"ok\"}"
        values: "0+85x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingDrainErrorsWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 1% of drain passes fail"
              description: "More than 1% of drain passes fail over the window. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingDrainErrorsCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 10% of drain passes fail"
              description: "More than 10% of drain passes fail over the window. See deploy/alerts/README.md."
  - name: payment_mismatches
    interval: 1m
    input_series:
      - series: "openbilling_payments_mismatches_total{job=\"low\"}"
        values: "_x5 0.5x35"
      - series: "openbilling_payments_mismatches_total{job=\"band\"}"
        values: "_x5 5.5x35"
      - series: "openbilling_payments_mismatches_total{job=\"high\"}"
        values: "_x5 15x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingPaymentMismatchesWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 1 or more payments read back differ from their top-up in the last hour"
              description: "At least 1 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
      - eval_time: 21m
        alertname: OpenbillingPaymentMismatchesCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 10 or more payments read back differ from their top-up in the last hour"
              description: "At least 10 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
  - name: topups_expired
    interval: 1m
    input_series:
      - series: "openbilling_topups_expired_total{job=\"low\"}"
        values: "_x5 2.5x35"
      - series: "openbilling_topups_expired_total{job=\"band\"}"
        values: "_x5 27.5x35"
      - series: "openbilling_topups_expired_total{job=\"high\"}"
        values: "_x5 75x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingTopUpsExpiredWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 5 or more pending top-ups expired in the last hour"
              description: "At least 5 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
      - eval_time: 21m
        alertname: OpenbillingTopUpsExpiredCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 50 or more pending top-ups expired in the last hour"
              description: "At least 50 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
  - name: pool_used_ratio
    interval: 1m
    input_series:
      - series: "db_client_connection_count{job=\"low\",state=\"used\"}"
        values: "35x40"
      - series: "db_client_connection_max{job=\"low\"}"
        values: "100x40"
      - series: "db_client_connection_count{job=\"band\",state=\"used\"}"
        values: "80x40"
      - series: "db_client_connection_max{job=\"band\"}"
        values: "100x40"
      - series: "db_client_connection_count{job=\"high\",state=\"used\"}"
        values: "95x40"
      - series: "db_client_connection_max{job=\"high\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingPoolSaturatedWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: band
            exp_annotations:
              summary: "warning: 70% of the connection pool is in use"
              description: "More than 70% of the connection pool is in use: requests wait for a connection. See deploy/alerts/README.md."
      - eval_time: 19m
        alertname: OpenbillingPoolSaturatedCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: high
            exp_annotations:
              summary: "critical: 90% of the connection pool is in use"
              description: "More than 90% of the connection pool is in use: requests wait for a connection. See deploy/alerts/README.md."
  - name: http_5xx_ratio_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"5xx\"}"
        values: "0+0.55x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"2xx\"}"
        values: "0+99.45x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingHttp5xxCritical
        exp_alerts: []
  - name: http_4xx_ratio_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"4xx\"}"
        values: "0+12.5x40"
      - series: "http_server_request_duration_seconds_count{job=\"band\",status=\"2xx\"}"
        values: "0+87.5x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingHttp4xxCritical
        exp_alerts: []
  - name: allowed_refused_ratio_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_allowed_checks_total{job=\"band\",verdict=\"refused\"}"
        values: "0+35x40"
      - series: "openbilling_allowed_checks_total{job=\"band\",verdict=\"allowed\"}"
        values: "0+65x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingAllowedRefusedCritical
        exp_alerts: []
  - name: queue_backlog_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_queue_backlog{job=\"band\"}"
        values: "55000x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingQueueBacklogCritical
        exp_alerts: []
  - name: queue_backlog_critical_inclusive
    interval: 1m
    input_series:
      - series: "openbilling_queue_backlog{job=\"edge\"}"
        values: "100000x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingQueueBacklogCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: edge
            exp_annotations:
              summary: "critical: the usage queue holds 100000 undecided events"
              description: "More than 100000 usage events are received and not decided: the drain is behind or stopped. See deploy/alerts/README.md."
      - eval_time: 19m
        alertname: OpenbillingQueueBacklogWarning
        exp_alerts: []
  - name: queue_oldest_age_seconds_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_queue_oldest_age_seconds{job=\"band\"}"
        values: "165x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingQueueOldestAgeCritical
        exp_alerts: []
  - name: queue_oldest_age_seconds_critical_inclusive
    interval: 1m
    input_series:
      - series: "openbilling_queue_oldest_age_seconds{job=\"edge\"}"
        values: "300x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingQueueOldestAgeCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: edge
            exp_annotations:
              summary: "critical: the oldest undecided event has waited 300"
              description: "The oldest undecided usage event has waited more than 300 seconds: what a producer feels as lag. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingQueueOldestAgeWarning
        exp_alerts: []
  - name: drain_lag_seconds_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_drain_lag_seconds{job=\"band\"}"
        values: "75x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingDrainLagCritical
        exp_alerts: []
  - name: drain_lag_seconds_critical_inclusive
    interval: 1m
    input_series:
      - series: "openbilling_drain_lag_seconds{job=\"edge\"}"
        values: "120x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingDrainLagCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: edge
            exp_annotations:
              summary: "critical: no drain pass has succeeded for 120"
              description: "No drain pass has succeeded for more than 120 seconds, even with an empty queue: the drain fails or has stopped while the service still reports. A service that reports nothing is OpenbillingNotReportingCritical. See deploy/alerts/README.md."
      - eval_time: 14m
        alertname: OpenbillingDrainLagWarning
        exp_alerts: []
  - name: drain_error_ratio_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_drain_runs_total{job=\"band\",result=\"error\"}"
        values: "0+5.5x40"
      - series: "openbilling_drain_runs_total{job=\"band\",result=\"ok\"}"
        values: "0+94.5x40"
    alert_rule_test:
      - eval_time: 14m
        alertname: OpenbillingDrainErrorsCritical
        exp_alerts: []
  - name: payment_mismatches_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_payments_mismatches_total{job=\"band\"}"
        values: "_x5 5.5x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingPaymentMismatchesCritical
        exp_alerts: []
  - name: payment_mismatches_critical_inclusive
    interval: 1m
    input_series:
      - series: "openbilling_payments_mismatches_total{job=\"edge\"}"
        values: "_x5 10x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingPaymentMismatchesCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: edge
            exp_annotations:
              summary: "critical: 10 or more payments read back differ from their top-up in the last hour"
              description: "At least 10 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
      - eval_time: 21m
        alertname: OpenbillingPaymentMismatchesWarning
        exp_alerts: []
  - name: payment_mismatches_first_event
    interval: 1m
    input_series:
      - series: "openbilling_payments_mismatches_total{job=\"first\"}"
        values: "_x10 1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenbillingPaymentMismatchesWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: first
            exp_annotations:
              summary: "warning: 1 or more payments read back differ from their top-up in the last hour"
              description: "At least 1 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
  - name: topups_expired_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "openbilling_topups_expired_total{job=\"band\"}"
        values: "_x5 27.5x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingTopUpsExpiredCritical
        exp_alerts: []
  - name: topups_expired_critical_inclusive
    interval: 1m
    input_series:
      - series: "openbilling_topups_expired_total{job=\"edge\"}"
        values: "_x5 50x35"
    alert_rule_test:
      - eval_time: 21m
        alertname: OpenbillingTopUpsExpiredCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              job: edge
            exp_annotations:
              summary: "critical: 50 or more pending top-ups expired in the last hour"
              description: "At least 50 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
      - eval_time: 21m
        alertname: OpenbillingTopUpsExpiredWarning
        exp_alerts: []
  - name: topups_expired_first_event
    interval: 1m
    input_series:
      - series: "openbilling_topups_expired_total{job=\"first\"}"
        values: "_x10 7x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: OpenbillingTopUpsExpiredWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              job: first
            exp_annotations:
              summary: "warning: 5 or more pending top-ups expired in the last hour"
              description: "At least 5 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
  - name: pool_used_ratio_critical_silent_in_band
    interval: 1m
    input_series:
      - series: "db_client_connection_count{job=\"band\",state=\"used\"}"
        values: "80x40"
      - series: "db_client_connection_max{job=\"band\"}"
        values: "100x40"
    alert_rule_test:
      - eval_time: 19m
        alertname: OpenbillingPoolSaturatedCritical
        exp_alerts: []
  - name: not_reporting
    interval: 1m
    input_series:
      - series: "openbilling_drain_lag_seconds{job=\"openbilling\"}"
        values: "1 1 1 1 1 _x60"
    alert_rule_test:
      - eval_time: 4m
        alertname: OpenbillingNotReportingCritical
        exp_alerts: []
      - eval_time: 22m
        alertname: OpenbillingNotReportingCritical
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "critical: the service has reported no metrics for 10m"
              description: "openbilling_drain_lag_seconds, which a running service always reports, has had no sample for 10m: the service is down, its export or the Collector is broken, or the scrape is. Assumes one job per Prometheus. See deploy/alerts/README.md."
