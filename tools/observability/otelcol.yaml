# The Collector the stack runs: OTLP/HTTP in on 127.0.0.1:4318, the Prometheus exporter out on 127.0.0.1:8889 for
# Prometheus to scrape. Traces and logs go to the debug exporter (they are not part of the dashboards).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  prometheus:
    endpoint: 127.0.0.1:8889
    # `add_metric_suffixes` (default true) turns unit s into _seconds and a monotonic Sum into _total.
    add_metric_suffixes: true
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: none
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
