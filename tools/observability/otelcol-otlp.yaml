# The Collector of the `otlp` leg (OBS_LEG=otlp): OTLP/HTTP in on 127.0.0.1:4318, metrics out with the `otlphttp`
# exporter to Prometheus's own OTLP receiver on 127.0.0.1:9090 (run.sh rewrites both addresses). No `prometheus`
# exporter and no scrape. Traces and logs go to the debug exporter, as in otelcol.yaml.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  otlphttp/prometheus:
    # A signal-specific endpoint is used as given: no /v1/metrics is appended to it.
    metrics_endpoint: http://127.0.0.1:9090/api/v1/otlp/v1/metrics
    encoding: proto
    compression: none
    retry_on_failure:
      max_elapsed_time: 30s
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: none
    logs:
      level: warn
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlphttp/prometheus]
    traces:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
