# Scrapes the Collector's Prometheus exporter every 2 s and evaluates the shipped alert rules. `honor_labels` keeps
# the `job` the exporter derives from service.name (without it the label would be `exported_job`).
# run.sh replaces @RULES@ with the absolute path of deploy/alerts/openbilling.rules.yaml.
global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files:
  - "@RULES@"
scrape_configs:
  - job_name: otelcol
    honor_labels: true
    static_configs:
      - targets: ["127.0.0.1:8889"]
