[package]
name = "openbilling"
description = "The openbilling-rs service."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
clap.workspace = true
cratestack.workspace = true
openbilling-core.workspace = true
openbilling-http.workspace = true
openbilling-jwt.workspace = true
openbilling-pg.workspace = true
openbilling-telemetry.workspace = true
openbilling-vpay.workspace = true
# The configuration file (`OPENBILLING_CONFIG`): the deployer's policy, as YAML.
serde.workspace = true
serde-saphyr.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true

[dev-dependencies]
openbilling-core.workspace = true
openbilling-jwt = { workspace = true, features = ["test-issuer"] }
openbilling-sdk.workspace = true
openbilling-telemetry = { workspace = true, features = ["testkit"] }
openbilling-testkit.workspace = true
openbilling-vpay = { workspace = true, features = ["stand-in"] }
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
# The SIGTERM test and the end-to-end suite make their own databases, as the other crates' tests do.
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
url.workspace = true

# The end-to-end suite (`e2e/`): this binary, started as a process (`CARGO_BIN_EXE_openbilling`), against a real
# PostgreSQL 19. A test target of this package because only its own tests are handed the built binary's path.
[[test]]
name = "e2e"
path = "../../e2e/main.rs"

[lints]
workspace = true
