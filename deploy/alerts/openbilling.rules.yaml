# Generated by tools/dashboards/alerts.py from tools/dashboards/thresholds.toml: edit those, never this file.
# Each signal has a warning alert (from `warning` up to `critical`) and a critical alert. deploy/alerts/README.md
# says what each means.
groups:
  - name: openbilling
    rules:
      - alert: OpenbillingHttp5xxWarning
        expr: "(sum by (job) (rate(http_server_request_duration_seconds_count{status=\"5xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) >= 0.001 and (sum by (job) (rate(http_server_request_duration_seconds_count{status=\"5xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) < 0.01"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "warning: 0.1% of requests answer 5xx"
          description: "The service answers 5xx to more than 0.1% of its requests over the window: a bug, PostgreSQL unavailable, or a deploy gone wrong. See deploy/alerts/README.md."
      - alert: OpenbillingHttp5xxCritical
        expr: "(sum by (job) (rate(http_server_request_duration_seconds_count{status=\"5xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) >= 0.01"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "critical: 1% of requests answer 5xx"
          description: "The service answers 5xx to more than 1% of its requests over the window: a bug, PostgreSQL unavailable, or a deploy gone wrong. See deploy/alerts/README.md."
      - alert: OpenbillingHttp4xxWarning
        expr: "(sum by (job) (rate(http_server_request_duration_seconds_count{status=\"4xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) >= 0.05 and (sum by (job) (rate(http_server_request_duration_seconds_count{status=\"4xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) < 0.2"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "warning: 5% of requests are refused with 4xx"
          description: "More than 5% of requests are refused with 4xx over the window: a producer sending bad requests, or a credential or issuer problem. See deploy/alerts/README.md."
      - alert: OpenbillingHttp4xxCritical
        expr: "(sum by (job) (rate(http_server_request_duration_seconds_count{status=\"4xx\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))) >= 0.2"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "critical: 20% of requests are refused with 4xx"
          description: "More than 20% of requests are refused with 4xx over the window: a producer sending bad requests, or a credential or issuer problem. See deploy/alerts/README.md."
      - alert: OpenbillingAllowedRefusedWarning
        expr: "(sum by (job) (rate(openbilling_allowed_checks_total{verdict=\"refused\"}[5m])) / sum by (job) (rate(openbilling_allowed_checks_total[5m]))) >= 0.2 and (sum by (job) (rate(openbilling_allowed_checks_total{verdict=\"refused\"}[5m])) / sum by (job) (rate(openbilling_allowed_checks_total[5m]))) < 0.5"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "warning: 20% of getAllowed answers refuse"
          description: "More than 20% of getAllowed answers refuse over the window: usage is being stopped (debt limit, balance or member cap). See deploy/alerts/README.md."
      - alert: OpenbillingAllowedRefusedCritical
        expr: "(sum by (job) (rate(openbilling_allowed_checks_total{verdict=\"refused\"}[5m])) / sum by (job) (rate(openbilling_allowed_checks_total[5m]))) >= 0.5"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "critical: 50% of getAllowed answers refuse"
          description: "More than 50% of getAllowed answers refuse over the window: usage is being stopped (debt limit, balance or member cap). See deploy/alerts/README.md."
      - alert: OpenbillingQueueBacklogWarning
        expr: "(max by (job) (openbilling_queue_backlog)) >= 10000 and (max by (job) (openbilling_queue_backlog)) < 100000"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "warning: the usage queue holds 10000 undecided events"
          description: "More than 10000 usage events are received and not decided: the drain is behind or stopped. See deploy/alerts/README.md."
      - alert: OpenbillingQueueBacklogCritical
        expr: "(max by (job) (openbilling_queue_backlog)) >= 100000"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "critical: the usage queue holds 100000 undecided events"
          description: "More than 100000 usage events are received and not decided: the drain is behind or stopped. See deploy/alerts/README.md."
      - alert: OpenbillingQueueOldestAgeWarning
        expr: "(max by (job) (openbilling_queue_oldest_age_seconds)) >= 30 and (max by (job) (openbilling_queue_oldest_age_seconds)) < 300"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "warning: the oldest undecided event has waited 30"
          description: "The oldest undecided usage event has waited more than 30 seconds: what a producer feels as lag. See deploy/alerts/README.md."
      - alert: OpenbillingQueueOldestAgeCritical
        expr: "(max by (job) (openbilling_queue_oldest_age_seconds)) >= 300"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "critical: the oldest undecided event has waited 300"
          description: "The oldest undecided usage event has waited more than 300 seconds: what a producer feels as lag. See deploy/alerts/README.md."
      - alert: OpenbillingDrainLagWarning
        expr: "(max by (job) (openbilling_drain_lag_seconds)) >= 30 and (max by (job) (openbilling_drain_lag_seconds)) < 120"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "warning: no drain pass has succeeded for 30"
          description: "No drain pass has succeeded for more than 30 seconds, even with an empty queue: the drain fails or has stopped while the service still reports. A service that reports nothing is OpenbillingNotReportingCritical. See deploy/alerts/README.md."
      - alert: OpenbillingDrainLagCritical
        expr: "(max by (job) (openbilling_drain_lag_seconds)) >= 120"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "critical: no drain pass has succeeded for 120"
          description: "No drain pass has succeeded for more than 120 seconds, even with an empty queue: the drain fails or has stopped while the service still reports. A service that reports nothing is OpenbillingNotReportingCritical. See deploy/alerts/README.md."
      - alert: OpenbillingDrainErrorsWarning
        expr: "(sum by (job) (rate(openbilling_drain_runs_total{result=\"error\"}[5m])) / sum by (job) (rate(openbilling_drain_runs_total[5m]))) >= 0.01 and (sum by (job) (rate(openbilling_drain_runs_total{result=\"error\"}[5m])) / sum by (job) (rate(openbilling_drain_runs_total[5m]))) < 0.1"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "warning: 1% of drain passes fail"
          description: "More than 1% of drain passes fail over the window. See deploy/alerts/README.md."
      - alert: OpenbillingDrainErrorsCritical
        expr: "(sum by (job) (rate(openbilling_drain_runs_total{result=\"error\"}[5m])) / sum by (job) (rate(openbilling_drain_runs_total[5m]))) >= 0.1"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "critical: 10% of drain passes fail"
          description: "More than 10% of drain passes fail over the window. See deploy/alerts/README.md."
      - alert: OpenbillingPaymentMismatchesWarning
        expr: "(sum by (job) ((openbilling_payments_mismatches_total unless openbilling_payments_mismatches_total offset 1h) or increase(openbilling_payments_mismatches_total[1h]))) >= 1 and (sum by (job) ((openbilling_payments_mismatches_total unless openbilling_payments_mismatches_total offset 1h) or increase(openbilling_payments_mismatches_total[1h]))) < 10"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "warning: 1 or more payments read back differ from their top-up in the last hour"
          description: "At least 1 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
      - alert: OpenbillingPaymentMismatchesCritical
        expr: "(sum by (job) ((openbilling_payments_mismatches_total unless openbilling_payments_mismatches_total offset 1h) or increase(openbilling_payments_mismatches_total[1h]))) >= 10"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "critical: 10 or more payments read back differ from their top-up in the last hour"
          description: "At least 10 payments read back from the payment provider differ from the top-up recorded for them over the last hour (owner, label, currency or amount): read the `field` label on the payments panel, and settle each by hand. See deploy/alerts/README.md."
      - alert: OpenbillingTopUpsExpiredWarning
        expr: "(sum by (job) ((openbilling_topups_expired_total unless openbilling_topups_expired_total offset 1h) or increase(openbilling_topups_expired_total[1h]))) >= 5 and (sum by (job) ((openbilling_topups_expired_total unless openbilling_topups_expired_total offset 1h) or increase(openbilling_topups_expired_total[1h]))) < 50"
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "warning: 5 or more pending top-ups expired in the last hour"
          description: "At least 5 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
      - alert: OpenbillingTopUpsExpiredCritical
        expr: "(sum by (job) ((openbilling_topups_expired_total unless openbilling_topups_expired_total offset 1h) or increase(openbilling_topups_expired_total[1h]))) >= 50"
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "critical: 50 or more pending top-ups expired in the last hour"
          description: "At least 50 pending top-ups were older than the reconciler's stop_after over the last hour and are no longer read back: webhooks may be lost. A late webhook or reconcilePayment still settles them. See deploy/alerts/README.md."
      - alert: OpenbillingPoolSaturatedWarning
        expr: "(sum by (job) (db_client_connection_count{state=\"used\"}) / sum by (job) (db_client_connection_max)) >= 0.7 and (sum by (job) (db_client_connection_count{state=\"used\"}) / sum by (job) (db_client_connection_max)) < 0.9"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "warning: 70% of the connection pool is in use"
          description: "More than 70% of the connection pool is in use: requests wait for a connection. See deploy/alerts/README.md."
      - alert: OpenbillingPoolSaturatedCritical
        expr: "(sum by (job) (db_client_connection_count{state=\"used\"}) / sum by (job) (db_client_connection_max)) >= 0.9"
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "critical: 90% of the connection pool is in use"
          description: "More than 90% of the connection pool is in use: requests wait for a connection. See deploy/alerts/README.md."
      - alert: OpenbillingNotReportingCritical
        expr: "absent_over_time(openbilling_drain_lag_seconds[10m])"
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "critical: the service has reported no metrics for 10m"
          description: "openbilling_drain_lag_seconds, which a running service always reports, has had no sample for 10m: the service is down, its export or the Collector is broken, or the scrape is. Assumes one job per Prometheus. See deploy/alerts/README.md."
