# openbilling on the bjw-s common library v5 (Chart.yaml). Everything below the `openbilling` block is the common
# library's own values, as app-template takes them: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
# Strings are Helm templates, evaluated once by the library (`global.templateEvaluation`).
#
# The chart holds no secret: the database URL comes from a Secret that already exists, named below.

# -- The chart's own settings. Refused when wrong by templates/_validate.tpl.
openbilling:
  database:
    # -- The existing Secret that holds the PostgreSQL 19 database URL (`postgres://…` or `postgresql://…`). The
    # chart never makes it. A CloudNativePG cluster's `<cluster>-app` Secret has the URL under `uri`.
    existingSecret: openbilling-database
    # -- The key of that Secret that holds the URL.
    key: uri
  otel:
    # -- The OpenTelemetry collector's base URL (OTLP/HTTP with JSON bodies): `/v1/traces`, `/v1/metrics` and
    # `/v1/logs` are appended. **Empty: OpenTelemetry is off.** Headers, which carry a credential, are never a value:
    # mount a file from a Secret of your own with `persistence` and point OPENBILLING_OTEL_HEADERS_FILE at it
    # (README, *OpenTelemetry*).
    endpoint: ""
    # -- `deployment.environment.name` on every signal; empty leaves it out.
    environment: ""
  # -- The token verifier (ADR 0003, amended 2026-11-27, D1 to D6): a JWT against one issuer's keys. Unset by
  # default, and then every /v1 call answers 401 (`RefuseAll`): nothing is ever open by default. Set `issuer` and
  # `audience` together, or neither; the other three need both. None of them is a secret.
  auth:
    # -- The issuer, exactly as tokens name it in `iss`; its keys are found through its discovery document
    # (`<issuer>/.well-known/openid-configuration`). `https`, or `http` to a loopback address. OPENBILLING_AUTH_ISSUER.
    issuer: ""
    # -- The audience a token's `aud` must hold. OPENBILLING_AUTH_AUDIENCE.
    audience: ""
    # -- The issuer's JWKS URL, when its discovery document is not to be used. OPENBILLING_AUTH_JWKS_URL.
    jwksUrl: ""
    # -- The claim that holds the roles, a dotted path (`realm_access.roles` for Keycloak); empty is `roles`.
    # OPENBILLING_AUTH_ROLES_CLAIM.
    rolesClaim: ""
    # -- How the issuer's role values map to openbilling's two roles: `value=operator,value=producer`; empty is
    # each value as itself. OPENBILLING_AUTH_ROLE_MAP.
    roleMap: ""
  # -- The service's configuration file: the deployer's policy, never a secret or an endpoint (those are the
  # environment's). Rendered as YAML into the ConfigMap `config`, mounted read-only at /etc/openbilling/config.yaml
  # and named by OPENBILLING_CONFIG; a change rolls the pods. Refused when wrong by templates/_validate.tpl, as the
  # binary refuses it at start. The owner's decision of 2026-11-27: the service reports the numbers, and the
  # deployer decides here how `getAllowed` judges them; and the retention margin of the usage partitions.
  config:
    # -- One comparison per check of `getAllowed`, in the order they run: `at_or_above` refuses when what is used
    # is at or above its bound, `above` when it is above it, `never` never (the numbers are reported either way).
    allowed:
      # -- The owner's debt against its debt limit. A limit of 0 refuses an owner who owes nothing under
      # `at_or_above` (0 >= 0); `above` lets debt reach the limit.
      debt_limit: at_or_above
      # -- The owner's debt against its drawable credit: `at_or_above` refuses a net balance of 0 or below, `above`
      # one below 0, `never` lets the debt limit alone decide.
      balance: at_or_above
      # -- A member's applied usage this month against their cap.
      member_cap: at_or_above
    retention:
      # -- How long after the intake window (7 days) a day's usage partition is detached and dropped, as digits and a
      # `d`: `1d` to `3650d`. The owner's decision of 2026-11-28: "drop after W plus a margin, default 90 days,
      # configurable". The job runs hourly, with the one that makes partitions ahead.
      margin: 90d
      # -- The longest a retention run waits for a lock (a detach waits for every transaction on the table) or runs a
      # statement: `1s` to `1h`, like `300s` or `5m`. A run that times out is retried at the next hour.
      timeout: 5m
    # `payments` and `reconcile`, not set by default, so the binary's defaults stand (ADR 0003, amended 2026-11-28).
    # `payments.unrecorded` is what to do with a succeeded payment no top-up was recorded for (one started before
    # top-ups were recorded, or one openbilling never asked for): `refuse` (the default: credit nothing, count a
    # mismatch) or `credit` (as before, from what the provider reports). `reconcile` says how the service reads back a
    # pending top-up whose webhook did not come: `pending_after: 15m` (not read before it is this old, `1s` to `7d`),
    # `read_again_after: 15m` (`1s` to `1d`), `stop_after: 7d` (a last read at this age, `1m` to `90d`, longer than
    # `pending_after`; only a top-up still pending then is `expired`), `last_read_for: 1d` (how long a failing last read is
    # retried, `1m` to `30d`, at least `read_again_after`), `every: 1m` (a pass, `1s` to `1h`) and `batch: 100` (`1` to `1000`). Only with a payment provider.
    # `vpay.token`, not set by default: the tunables of a vpay token the service mints itself (only with OPENBILLING_VPAY_CLIENT_ID and
    # OPENBILLING_VPAY_CLIENT_KEY_FILE in `controllers.main.containers.main.env`; the binary refuses them otherwise).
    # Each key is optional and left out here, so the adapter's default stands: `audience: vpay:v1`, `scope` none (vpay
    # grants the client's registered scopes), `refresh_skew_secs: 30` (at most 600, and at most half the token's life),
    # `retries: 2` (at most 10), `retry_backoff_ms: 200` (at most 5000). The client's id, key and endpoints are
    # environment variables, never here. For example:
    #   vpay:
    #     token:
    #       scope: payments:write
    #       retries: 3

controllers:
  main:
    type: deployment
    # -- One replica by default. More are safe for the drain (`FOR UPDATE SKIP LOCKED`) and for the migrations,
    # which each pod applies at start under sqlx's advisory lock (ADR 0005).
    replicas: 1
    strategy: RollingUpdate
    containers:
      main:
        image:
          repository: ghcr.io/vaam-apps/openbilling-rs
          # -- A fixed release, `appVersion` by default. Never `latest` (templates/_validate.tpl refuses it); a
          # floating tag (`edge`, `X.Y`) is refused without a digest.
          tag: "{{ .Chart.AppVersion }}"
          # -- The image index digest, `sha256:…`. Empty here; the chart release.yml publishes carries the digest
          # of the image built for the same release (the line below is the one it rewrites).
          digest: "" # digest: set by release.yml
          pullPolicy: IfNotPresent
        # `openbilling serve` applies the migrations (compiled into the binary), then serves the API, the payment
        # provider's webhook, `/healthz` and `/readyz`, and runs the drain. There is no separate migrate command,
        # so there is no migration Job.
        args:
          - serve
        env:
          # The binary's own default is 127.0.0.1:8080, this machine only; a pod must listen on its address for the
          # Service and the probes to reach it. Without `openbilling.auth` every /v1 call answers 401 (ADR 0003);
          # enable the NetworkPolicy below to choose who may connect.
          OPENBILLING_LISTEN: "0.0.0.0:8080"
          # OpenTelemetry: empty is off (the binary reads a blank variable as unset).
          OTEL_EXPORTER_OTLP_ENDPOINT: "{{ .Values.openbilling.otel.endpoint }}"
          OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name={{ .Values.openbilling.otel.environment }}"
          # The token verifier, from `openbilling.auth`. An empty value is unset to the binary, so the defaults
          # render these empty and the service keeps refusing every /v1 call.
          OPENBILLING_AUTH_ISSUER: "{{ .Values.openbilling.auth.issuer }}"
          OPENBILLING_AUTH_AUDIENCE: "{{ .Values.openbilling.auth.audience }}"
          OPENBILLING_AUTH_JWKS_URL: "{{ .Values.openbilling.auth.jwksUrl }}"
          OPENBILLING_AUTH_ROLES_CLAIM: "{{ .Values.openbilling.auth.rolesClaim }}"
          OPENBILLING_AUTH_ROLE_MAP: "{{ .Values.openbilling.auth.roleMap }}"
          # The configuration file, from `openbilling.config` (the ConfigMap `config`, mounted below).
          OPENBILLING_CONFIG: /etc/openbilling/config.yaml
          OPENBILLING_DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: "{{ .Values.openbilling.database.existingSecret }}"
                key: "{{ .Values.openbilling.database.key }}"
        # Named, so the probes can say `http`; the common library does not add it. The port is 8080 in three places,
        # here, OPENBILLING_LISTEN and the Service: move them together.
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        probes:
          # `/healthz` answers once the server listens, which is after the migrations: the startup probe gives them
          # up to 5 minutes before liveness counts.
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: http
              periodSeconds: 5
              failureThreshold: 60
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: http
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          # `/readyz` asks the database; a pod whose database does not answer leaves the Service.
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: http
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi

# The configuration file: `openbilling.config` as YAML. Its checksum is on the pod, so a change rolls the pods.
configMaps:
  config:
    enabled: true
    data:
      config.yaml: "{{ toYaml .Values.openbilling.config }}"
  # -- Off by default. The Grafana dashboards (deploy/dashboards, copied into this chart's dashboards/ and held equal
  # by a test) as a ConfigMap labelled for Grafana's dashboard sidecar. Set `enabled: true` to ship them.
  dashboards:
    enabled: false
    labels:
      grafana_dashboard: "1"
    data:
      openbilling-service.json: '{{ .Files.Get "dashboards/openbilling-service.json" }}'
      openbilling-queue.json: '{{ .Files.Get "dashboards/openbilling-queue.json" }}'

persistence:
  config:
    type: configMap
    identifier: config
    globalMounts:
      - path: /etc/openbilling/config.yaml
        subPath: config.yaml
        readOnly: true

defaultPodOptions:
  # The image's user: distroless `nonroot`, uid and gid 65532.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  # The service never calls the Kubernetes API.
  automountServiceAccountToken: false
  # `serve` stops on SIGTERM and finishes the requests in flight.
  terminationGracePeriodSeconds: 30

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

# -- Off by default. A starting point: callers from this namespace on the HTTP port; DNS, PostgreSQL (5432) and
# HTTPS (443, the payment provider) out. Narrow `to` and `from` to your cluster before relying on it.
networkpolicies:
  main:
    enabled: false
    controller: main
    policyTypes:
      - Ingress
      - Egress
    rules:
      ingress:
        - from:
            - podSelector: {}
          ports:
            - port: 8080
              protocol: TCP
      egress:
        - ports:
            - port: 53
              protocol: UDP
            - port: 53
              protocol: TCP
        - ports:
            - port: 5432
              protocol: TCP
        # HTTPS: the payment provider, and the token issuer's discovery document and keys.
        - ports:
            - port: 443
              protocol: TCP

# -- Off by default. The alert rules (deploy/alerts, copied into this chart's alerts/ and held equal by a test) as a
# PrometheusRule for the Prometheus Operator; needs its CRDs. `labels` are added to the object, for a Prometheus
# whose `ruleSelector` asks for some (for example `release: prometheus`).
prometheusRule:
  enabled: false
  labels: {}

# -- Off by default, and of no use yet: openbilling serves no `/metrics` today (it pushes OTLP instead, see
# `openbilling.otel`), so a ServiceMonitor would scrape a 404. Needs the Prometheus Operator's CRDs.
serviceMonitor:
  main:
    enabled: false
    service:
      identifier: main
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 1m
        scrapeTimeout: 10s
