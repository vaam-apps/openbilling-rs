# Everything on: a pinned digest, two replicas, the token verifier, the NetworkPolicy and the ServiceMonitor. The digest is a test
# fixture, not an image anyone pushed; render-check.sh then requires every image to carry one.
openbilling:
  database:
    existingSecret: billing-db-app
    key: uri
  auth:
    issuer: https://idp.example/realms/billing
    audience: billing
    jwksUrl: https://idp.example/realms/billing/protocol/openid-connect/certs
    rolesClaim: realm_access.roles
    roleMap: billing-admin=operator,meter=producer
controllers:
  main:
    replicas: 2
    containers:
      main:
        image:
          digest: sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
networkpolicies:
  main:
    enabled: true
serviceMonitor:
  main:
    enabled: true
