# A PostgreSQL 19 for the end-to-end suite (and every database test of the workspace), on this machine only.
# The image is the one CI's Test job runs: tag and digest, moved together with `.github/workflows/ci.yml`.
#
#   docker compose -f e2e/compose.yaml up -d --wait
#   export OPENBILLING_TEST_DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres
#   cargo test -p openbilling --test e2e
#   docker compose -f e2e/compose.yaml down
services:
  postgres:
    image: postgres:19.0@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e
    environment:
      # A throwaway server reachable from this machine alone: no password to keep.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
